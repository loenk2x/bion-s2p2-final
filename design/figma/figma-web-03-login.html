<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web — Login</title>
<style>

:root{
  --hijau-700:#0E6E49; --hijau-600:#128A5B; --hijau-500:#19A96F;
  --hijau-100:#DCF3E8; --hijau-50:#F1FAF5;
  --jingga-500:#F2762E; --jingga-100:#FDE8DA;
  --tinta-900:#12211B; --tinta-600:#4B5B54; --tinta-400:#84968D;
  --garis:#E2EBE6; --putih:#fff; --latar:#F6FBF8;
  --bahaya:#D2453C; --bahaya-100:#FBE4E2;
  --biru-t:#1A4E8A; --biru-l:#DDEAFB;
  /* jenis aktivitas */
  --ak-langkah:#F2762E; --ak-olahraga:#19A96F; --ak-air:#2D7FF9;
  --ak-tidur:#7A5AF8;  --ak-napas:#0E9DA8;    --ak-berat:#C9820A;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
  --b1:0 1px 2px rgba(18,33,27,.06), 0 1px 3px rgba(18,33,27,.04);
  --b2:0 4px 12px rgba(18,33,27,.08);
  --b3:0 8px 24px rgba(18,33,27,.16);
  --font:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --skala-web:.58;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:#EFF4F1;color:var(--tinta-900);-webkit-font-smoothing:antialiased}

/* ---------- kerangka dokumen ---------- */
.doc-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--garis);padding:12px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc-nav strong{font-size:15px;margin-right:12px}
.doc-nav a{font-size:13px;color:var(--tinta-600);text-decoration:none;padding:6px 10px;border-radius:var(--r-full)}
.doc-nav a:hover{background:var(--hijau-100);color:var(--hijau-700)}
.doc{max-width:1360px;margin:0 auto;padding:32px 24px 80px}
.doc h1{font-size:30px;margin:24px 0 8px}
.doc h2{font-size:22px;margin:48px 0 4px;padding-top:16px;border-top:1px solid var(--garis)}
.doc h3{font-size:15px;margin:28px 0 10px;color:var(--tinta-600);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
.doc p.ket{color:var(--tinta-600);font-size:14px;line-height:22px;max-width:74ch;margin:6px 0 0}
.grid-swatch{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.sw{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r-md);overflow:hidden}
.sw i{display:block;height:56px}
.sw b{display:block;font-size:12px;padding:8px 10px 2px}
.sw code{display:block;font-size:11px;color:var(--tinta-400);padding:0 10px 10px;font-family:ui-monospace,Consolas,monospace}
.papan{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r-md);padding:20px;margin-top:16px}
.baris{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.label-mini{font-size:11px;color:var(--tinta-400);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.mini-tabel{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;background:#fff}
.mini-tabel th,.mini-tabel td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--garis);vertical-align:top}
.mini-tabel th{font-weight:600;color:var(--tinta-600);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.catatan-rev{background:var(--hijau-50);border:1px solid var(--hijau-100);border-radius:var(--r-md);
  padding:14px 16px;margin-top:14px;font:400 13px/20px var(--font);color:var(--tinta-600)}
.catatan-rev b{color:var(--hijau-700)}

/* ---------- token bersama antar-mockup ---------- */
.tombol{height:44px;border-radius:var(--r-md);padding:0 20px;font:600 15px/1 var(--font);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;white-space:nowrap}
.t-primer{background:var(--hijau-600);color:#fff}
.t-sekunder{background:#fff;color:var(--hijau-600);border:1px solid var(--hijau-600)}
.t-netral{background:#fff;color:var(--tinta-900);border:1px solid var(--garis)}
.t-bahaya{background:#fff;color:var(--bahaya);border:1px solid var(--bahaya)}
.t-teks{background:none;color:var(--hijau-600);padding:0 4px}
.t-mati{background:var(--garis);color:var(--tinta-400)}
.t-kecil{height:36px;padding:0 14px;font-size:13px}
.t-blok{width:100%}

.kolom{display:flex;flex-direction:column}
.inp-label{font:600 12px/16px var(--font);color:var(--tinta-600);margin-bottom:8px;display:block}
.inp{height:48px;border:1px solid var(--garis);border-radius:var(--r-sm);background:#fff;
  padding:0 14px;font:400 15px/48px var(--font);color:var(--tinta-900)}
.inp.ph{color:var(--tinta-400)}
.inp-fokus{border-color:var(--hijau-600);box-shadow:0 0 0 3px var(--hijau-100)}
.inp-galat{border-color:var(--bahaya)}
.pesan-galat{font:600 12px/16px var(--font);color:var(--bahaya);margin-top:6px}
.inp-bungkus{position:relative}
.inp-bungkus .mata{position:absolute;right:12px;top:12px;color:var(--tinta-400)}

.chip{height:34px;border-radius:var(--r-full);padding:0 14px;border:1px solid var(--garis);background:#fff;
  color:var(--tinta-600);font:400 13px/32px var(--font);white-space:nowrap;flex:none}
.chip.on{background:var(--hijau-600);border-color:var(--hijau-600);color:#fff;font-weight:600}

/* tab tipe konten — garis bawah, sengaja dibuat beda dari chip kategori */
.tab-garis{display:flex;gap:20px;border-bottom:1px solid var(--garis)}
.tab-garis a{padding:10px 0 10px;font:600 14px/18px var(--font);color:var(--tinta-400);
  text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab-garis a.on{color:var(--hijau-700);border-bottom-color:var(--hijau-600)}

.lencana{height:22px;border-radius:var(--r-sm);padding:0 8px;font:600 12px/22px var(--font);display:inline-block}
.l-art{background:var(--hijau-100);color:var(--hijau-700)}
.l-vid{background:var(--jingga-100);color:#9A3F0B}
.l-inf{background:var(--biru-l);color:var(--biru-t)}

.avatar{border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.a-40{width:40px;height:40px;font-size:15px}
.a-56{width:56px;height:56px;font-size:20px}
.a-80{width:80px;height:80px;font-size:28px}

.ikon-bulat{width:40px;height:40px;border-radius:var(--r-full);background:#fff;border:1px solid var(--garis);
  display:flex;align-items:center;justify-content:center;color:var(--tinta-600);flex:none}
.ikon-bulat.on{color:var(--hijau-600);border-color:var(--hijau-100);background:var(--hijau-50)}

.kartu{background:#fff;border-radius:var(--r-md);box-shadow:var(--b1);overflow:hidden}
.sampul{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#CFE9DC,#EAD9C8)}
.sampul img{width:100%;height:100%;object-fit:cover;display:block}
.sampul .lencana{position:absolute;left:10px;top:10px}
.simpan{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:var(--r-full);
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:var(--tinta-600);box-shadow:var(--b1)}
.simpan.on{color:var(--hijau-600)}
.kartu-isi{padding:16px}
.kartu-judul{font:600 18px/24px var(--font);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kartu-kutip{font:400 13px/18px var(--font);color:var(--tinta-600);margin:6px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kartu-meta{font:600 12px/16px var(--font);color:var(--tinta-400);margin-top:12px}

.baris-konten{display:flex;gap:12px;background:#fff;border-radius:var(--r-md);box-shadow:var(--b1);padding:10px;align-items:center}
.baris-konten .thumb{width:96px;height:72px;border-radius:var(--r-sm);object-fit:cover;flex:none;background:#CFE9DC}
.baris-konten h4{font:600 15px/20px var(--font);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.baris-konten .meta{font:600 12px/16px var(--font);color:var(--tinta-400);margin-top:6px}

/* baris favorit yang bisa digeser ke kiri */
.geser-luar{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--bahaya)}
.geser-hapus{position:absolute;right:0;top:0;bottom:0;width:84px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:#fff;font:600 11px/14px var(--font)}
.geser-isi{position:relative;transition:none}
.geser-luar.aktif .geser-isi{transform:translateX(-84px)}

/* cincin harian */
.cincin-kartu{background:#fff;border-radius:var(--r-lg);box-shadow:var(--b1);padding:18px 16px 14px;position:relative}
.cincin-svg{display:block;margin:0 auto}
.cincin-aktif{transform-box:fill-box;transform-origin:center;mix-blend-mode:multiply;
  animation:denyut 3.6s ease-in-out infinite}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.cincin-aktif{animation:none}}
.cincin-legenda{display:flex;margin-top:10px}
.cincin-legenda div{flex:1;text-align:center;position:relative}
.cincin-legenda div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--garis)}
.cincin-legenda .l{font:600 12px/16px var(--font);color:var(--tinta-600);display:flex;align-items:center;justify-content:center;gap:5px}
.cincin-legenda .l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cincin-legenda .n{font:700 20px/26px var(--font);margin-top:2px}
.cincin-legenda .n .tgt{font:600 12px/16px var(--font);color:var(--tinta-400);margin-left:1px}
.cincin-legenda .sat{font:400 11px/15px var(--font);color:var(--tinta-400);margin-top:1px}
.cincin-target{position:absolute;right:14px;top:14px;font:600 11px/14px var(--font);color:var(--hijau-700);
  background:var(--hijau-100);border-radius:var(--r-full);padding:5px 10px}

/* kartu aktivitas dengan latar bergambar */
.ak{position:relative;border-radius:var(--r-md);padding:14px;overflow:hidden;background:#fff;box-shadow:var(--b1)}
.ak .cap{position:absolute;left:0;top:0;bottom:0;width:4px}
.ak .wm{position:absolute;right:-14px;bottom:-18px;opacity:.13;pointer-events:none}
.ak .jam{font:600 11px/14px var(--font);color:var(--tinta-400)}
.ak .nilai{font:700 22px/28px var(--font);margin-top:4px}
.ak .nilai span{font:400 13px/18px var(--font);color:var(--tinta-400);margin-left:4px}
.ak .jns{font:600 12px/16px var(--font);margin-top:2px}
.ak .cat{font:400 13px/18px var(--font);color:var(--tinta-600);margin-top:6px}

.ringkas{background:#fff;border-radius:var(--r-md);box-shadow:var(--b1);padding:16px}
.ringkas .l{font:600 12px/16px var(--font);color:var(--tinta-600)}
.ringkas .n{font:700 26px/30px var(--font);margin-top:6px}
.ringkas .n span{font:400 13px/18px var(--font);color:var(--tinta-400);margin-left:4px}

.kosong{text-align:center;padding:40px 24px}
.kosong svg{color:var(--tinta-400)}
.kosong h4{font:600 18px/24px var(--font);margin:12px 0 0}
.kosong p{font:400 13px/18px var(--font);color:var(--tinta-600);margin:6px 0 16px}

/* ---------- bingkai mobile ---------- */
.rak{display:flex;gap:28px;flex-wrap:wrap;margin-top:20px}
.hp{width:390px;flex:none}
.hp-nama{font:600 13px/16px var(--font);color:var(--tinta-600);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.hp-layar{width:390px;height:844px;background:var(--latar);border:10px solid #12211B;border-radius:38px;
  overflow:hidden;position:relative;box-shadow:var(--b2)}
.hp-status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;
  font:600 12px/16px var(--font);color:var(--tinta-900)}
.hp-isi{height:800px;overflow:hidden;position:relative}
.hp-gulir{padding:0 16px 16px}
.hp-tab{position:absolute;left:0;right:0;bottom:0;height:86px;padding-bottom:22px;background:#fff;
  border-top:1px solid var(--garis);box-shadow:var(--b2);display:flex;border-radius:0 0 28px 28px}
.hp-tab a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--tinta-400);text-decoration:none;font:600 11px/14px var(--font)}
.hp-tab a.on{color:var(--hijau-600)}
.hp-tab::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:9px;
  width:120px;height:4px;border-radius:2px;background:#D6DFDA}
.hp-head{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--garis)}
.hp-head h2{font:700 18px/24px var(--font);margin:0}

/* tombol tambah mengambang, mengacu pola Strava */
.fab{position:absolute;right:16px;bottom:102px;width:56px;height:56px;border-radius:var(--r-full);
  background:var(--hijau-600);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--b3)}
.tirai{position:absolute;inset:0;background:rgba(18,33,27,.55)}
.pilihan{position:absolute;right:16px;bottom:170px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.pilihan a{display:flex;align-items:center;gap:12px;text-decoration:none}
.pilihan span{background:#fff;border-radius:var(--r-sm);padding:7px 12px;font:600 14px/18px var(--font);
  color:var(--tinta-900);box-shadow:var(--b2)}
.pilihan i{width:48px;height:48px;border-radius:var(--r-full);background:#fff;display:flex;
  align-items:center;justify-content:center;box-shadow:var(--b2)}

/* lembar modal dari bawah */
.lembar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:var(--r-lg) var(--r-lg) 28px 28px;
  padding:8px 16px 28px;box-shadow:var(--b3)}
.lembar .pegangan{width:40px;height:4px;border-radius:2px;background:#D6DFDA;margin:6px auto 14px}
.lembar h3{font:700 22px/28px var(--font);margin:0 0 4px}
.lembar p.sub{font:400 13px/18px var(--font);color:var(--tinta-600);margin:0 0 18px}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:8px 0 18px}
.stepper .tbl{width:52px;height:52px;border-radius:var(--r-full);border:1px solid var(--garis);background:#fff;
  display:flex;align-items:center;justify-content:center;font:400 26px/1 var(--font);color:var(--hijau-600)}
.stepper .nilai{font:700 44px/48px var(--font);min-width:88px;text-align:center}
.stepper .nilai span{font:400 14px/18px var(--font);color:var(--tinta-400);display:block;margin-top:2px}

.mood{display:flex;gap:8px}
.mood a{flex:1;height:52px;border:1px solid var(--garis);border-radius:var(--r-sm);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none}
.mood a.on{border-color:var(--hijau-600);background:var(--hijau-50);box-shadow:0 0 0 2px var(--hijau-100)}

.appbar-lay{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px}
.appbar-lay .ikon-bulat{background:rgba(255,255,255,.94);border-color:transparent;box-shadow:var(--b1)}

/* sesi latihan pernapasan */
.napas-bungkus{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.napas-cincin{position:absolute;border-radius:50%;background:#fff}
.napas-inti{position:relative;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.95);
  color:#0B7C86;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

/* ---------- bingkai web ---------- */
.slot{width:calc(1180px * var(--skala-web));height:calc(820px * var(--skala-web));margin-bottom:26px}
.wb{width:1180px;height:820px;transform:scale(var(--skala-web));transform-origin:top left;
  background:var(--latar);border-radius:14px;overflow:hidden;box-shadow:var(--b2);border:1px solid var(--garis);
  display:flex;flex-direction:column}
.wb-bar{height:38px;background:#E7EEEA;display:flex;align-items:center;gap:6px;padding:0 14px;flex:none}
.wb-bar i{width:11px;height:11px;border-radius:50%;background:#C9D6CF;display:block}
.wb-bar span{margin-left:12px;background:#fff;border-radius:var(--r-full);padding:3px 14px;
  font:400 12px/16px var(--font);color:var(--tinta-400)}
.wb-head{height:64px;background:#fff;border-bottom:1px solid var(--garis);display:flex;align-items:center;
  padding:0 32px;gap:28px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font:700 17px/1 var(--font)}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--hijau-600);display:flex;align-items:center;justify-content:center;color:#fff}
.wb-menu{display:flex;gap:24px;margin-left:16px}
.wb-menu a{font:600 14px/1 var(--font);color:var(--tinta-600);text-decoration:none}
.wb-menu a.on{color:var(--hijau-600)}
.wb-isi{flex:1;overflow:hidden;padding:28px 32px}
.wb-wadah{max-width:1120px;margin:0 auto}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

h1.judul-hal{font:700 34px/40px var(--font);margin:0}
.deret{display:flex;gap:8px;overflow:hidden}
.cari{height:48px;border:1px solid var(--garis);border-radius:var(--r-sm);background:#fff;display:flex;
  align-items:center;gap:10px;padding:0 14px;color:var(--tinta-400);font:400 15px/48px var(--font)}
.sumber{border:1px solid var(--garis);border-radius:var(--r-md);background:#fff;padding:14px}
.sumber .l{font:600 12px/16px var(--font);color:var(--tinta-400)}
.sumber .v{font:600 14px/20px var(--font);color:var(--hijau-600);margin-top:4px}
.isi-teks p{font:400 15px/24px var(--font);color:var(--tinta-900);margin:0 0 14px}
.isi-teks h3{font:600 18px/24px var(--font);margin:20px 0 8px;color:var(--tinta-900);text-transform:none;letter-spacing:0}
.pemutar{aspect-ratio:16/9;background:#12211B;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pemutar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.main-yt{width:64px;height:64px;border-radius:var(--r-full);background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;color:#D2453C;position:relative}
.pisah{height:1px;background:var(--garis);margin:16px 0}
.kel-tanggal{font:600 12px/16px var(--font);color:var(--tinta-400);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.infografis-bingkai{position:relative;border-radius:var(--r-md);overflow:hidden;background:#12211B}
.infografis-bingkai img{width:100%;display:block}
.perbesar{position:absolute;right:10px;bottom:10px;background:rgba(18,33,27,.8);color:#fff;border-radius:var(--r-full);
  padding:7px 12px;font:600 12px/16px var(--font);display:flex;align-items:center;gap:6px}
@media (max-width:900px){:root{--skala-web:.34}}


  .lembar-contoh{position:static;width:358px;border-radius:var(--r-lg);border:1px solid var(--garis);
    box-shadow:var(--b1);padding:8px 16px 20px;background:#fff}
  .rak-lembar{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
  .rak-lembar > div > p{font:600 12px/16px var(--font);color:var(--tinta-600);margin:0 0 8px;
    text-transform:uppercase;letter-spacing:.06em}
  .pintasan{display:flex;gap:8px;margin-bottom:16px}
  .pintasan span{flex:1;height:36px;border:1px solid var(--garis);border-radius:var(--r-sm);background:#fff;
    display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--font);color:var(--hijau-600)}
  .angka-inp{height:76px;border:1px solid var(--hijau-600);box-shadow:0 0 0 3px var(--hijau-100);
    border-radius:var(--r-md);background:#fff;display:flex;align-items:center;justify-content:center;
    gap:8px;margin:10px 0 14px}
  .angka-inp b{font:700 40px/44px var(--font)}
  .angka-inp i{width:2px;height:38px;background:var(--hijau-600);font-style:normal;display:block}
  .angka-inp span{font:400 15px/20px var(--font);color:var(--tinta-400);align-self:flex-end;margin-bottom:12px}
  .jenis-tombol{font:600 11px/15px var(--font);color:var(--tinta-400);text-align:center;margin:0 0 14px}
  .papan-tombol{background:#DDE4E0;padding:8px 6px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px}
  .papan-tombol span{height:46px;background:#fff;border-radius:6px;box-shadow:0 1px 0 rgba(18,33,27,.25);
    display:flex;align-items:center;justify-content:center;font:400 24px/1 var(--font);color:var(--tinta-900)}
  .papan-tombol span.kosong,.papan-tombol span.hapus{background:#C6D0CB;box-shadow:none}
  .papan-tombol span.hapus{font-size:18px}
  .durasi{display:flex;gap:10px;margin:6px 0 18px}
  .durasi span{flex:1;height:72px;border:1px solid var(--garis);border-radius:var(--r-md);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font:700 22px/26px var(--font);color:var(--tinta-900)}
  .durasi span i{font:400 12px/16px var(--font);color:var(--tinta-400);font-style:normal}
  .durasi span.on{border-color:var(--ak-napas);background:#EAF7F8;box-shadow:0 0 0 2px #CDECEF}
  

/* --- penyesuaian khusus ekspor Figma --- */
html,body{margin:0;padding:0;background:#fff}
body{padding:0}
.lembarkerja{display:flex;flex-wrap:wrap;gap:64px;padding:0;align-items:flex-start}
/* bingkai tidak boleh menyusut kalau jendela sempit — ukurannya harus tepat saat diimpor */
.lembarkerja>*{flex:0 0 auto}
.hp,.wb{flex:0 0 auto}
/* bingkai HP jadi ukuran artboard sebenarnya, tanpa bezel */
.hp-layar{border:0!important;border-radius:0!important;box-shadow:none!important;width:390px;height:844px}
.hp-tab{border-radius:0!important}
.lembar{border-radius:var(--r-lg) var(--r-lg) 0 0!important}
.papan-tombol{border-radius:0!important}
/* bingkai web jadi 1440x900, tanpa bilah browser palsu dan tanpa penskalaan */
.wb{transform:none!important;width:1440px;height:900px;border:0!important;border-radius:0!important;box-shadow:none!important}
.wb-bar{display:none!important}
.slot{width:auto;height:auto;margin:0}
/* dokumentasi tidak ikut diekspor */
.doc-nav,.doc h1,.doc h2,.doc p.ket,.mini-tabel,.catatan-rev,.hp-nama{display:none}
.papan{border:0;box-shadow:none;padding:0;margin:0}
.doc{max-width:none;margin:0;padding:0}
